name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests with coverage
        run: python -m pytest --cov=kvfabric --cov=kvflow --cov-report=term-missing

      - name: Run compare mode
        run: python simulator/run_experiment.py --mode compare

      - name: Run policy compare mode
        run: python simulator/run_experiment.py --mode policy-compare
