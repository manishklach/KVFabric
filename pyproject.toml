[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvfabric"
version = "0.1.0"
description = "Research prototype for semantic KV-cache orchestration in long-context LLM inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "KVFabric contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["simulator"]
testpaths = ["tests"]
